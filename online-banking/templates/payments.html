{% extends "base.html" %}
{% set active='payments' %}
{% block title %}Pay Bills — SenNet{% endblock %}
{% block content %}
<h1>Pay Bills</h1>
<div class="crumb">Pay utilities and billers directly from your account.</div>

{% if result %}<div class="alert {{ 'ok' if result[0]=='ok' else 'err' }}">{{ result[1] }}</div>{% endif %}

<div class="panel" style="max-width:560px">
  <form method="post" action="/payments">
    <label>From account</label>
    <select name="from_account" required>
      {% for a in my_accounts %}
      <option value="{{ a.account_no }}">{{ a.account_no }} — {{ a.account_type }} (LKR {{ '{:,.2f}'.format(a.balance) }})</option>
      {% endfor %}
    </select>
    <label>Biller</label>
    <select name="biller" required>
      {% for b in billers %}<option>{{ b }}</option>{% endfor %}
    </select>
    <label>Amount (LKR)</label><input type="number" step="0.01" name="amount" required>
    <button class="btn navy lg" type="submit" style="margin-top:18px">Pay now</button>
  </form>
</div>
{% endblock %}
