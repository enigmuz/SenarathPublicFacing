<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}CMS — Senarath Bank{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="sim-ribbon"><div class="inner">⚠ SIMULATION — SECURITY TRAINING LAB — <b>NOT A REAL BANK</b> — Staff CMS (vulnerable by design)</div></div>
<div class="admin-shell">
  <aside class="admin-side">
    <div class="lg"><img src="{{ url_for('static', filename='img/logo.png') }}"><b style="color:#fff">CMS</b></div>
    <a href="/admin/dashboard" class="{{ 'active' if active=='dash' }}">📊 Dashboard</a>
    <a href="/admin/messages" class="{{ 'active' if active=='msg' }}">✉ Contact Messages</a>
    <a href="/admin/news/new" class="{{ 'active' if active=='news' }}">📝 New Article</a>
    <a href="/admin/users" class="{{ 'active' if active=='users' }}">👥 CMS Users</a>
    <a href="/" >🌐 View Site</a>
    <a href="/admin/logout">🚪 Logout</a>
    <div style="margin-top:24px;font-size:12px;color:#7fa3c8;padding:0 12px">
      Signed in as<br><b style="color:#fff">{{ cms_user }}</b> ({{ cms_role }})
    </div>
  </aside>
  <main class="admin-main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
